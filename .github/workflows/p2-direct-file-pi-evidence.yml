name: P2 Direct-file Pi Evidence Harness

on:
  pull_request:
    branches:
      - experiment/p2-direct-file-pi-baseline
    paths:
      - ".github/workflows/p2-direct-file-pi-evidence.yml"
      - "scripts/p2-run-direct-file-pi-baseline.mjs"
      - "src/knowledge/eval/directFilePiBaseline.ts"
      - "src/knowledge/eval/directFilePiBaseline.test.ts"
      - "eval/corpus/**"
      - "eval/queries/development.jsonl"
      - "eval/labels/development.jsonl"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare frozen direct-file development tasks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused P2-T10 evaluator tests
        run: npm test -- src/knowledge/eval/directFilePiBaseline.test.ts

      - name: Focused P2-T10 lint
        run: npx eslint src/knowledge/eval/directFilePiBaseline.ts src/knowledge/eval/directFilePiBaseline.test.ts

      - name: Prepare frozen tasks without provider access
        env:
          P2_T10_EVIDENCE_OUT_DIR: /tmp/pi-knowledge-p2-evidence/p2-t10
        run: npx tsx scripts/p2-run-direct-file-pi-baseline.mjs --prepare-only

      - name: Upload preparation proof
        uses: actions/upload-artifact@v4
        with:
          name: p2-t10-direct-file-pi-prepare-proof
          path: /tmp/pi-knowledge-p2-evidence/p2-t10
          if-no-files-found: error
          retention-days: 14
